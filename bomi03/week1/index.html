<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSS 파일 업로드-->
     <link rel="stylesheet" href="./style.css" />
     <!-- JS 파일 업로드-->
      <script type="module" src="/src/script.ts" defer></script> <!-- defer를 넣으면 위에 넣어도 뒤에 넣는거랑 동일한 역할을 함 -->
    <title>UMC TODO</title>
  </head>

  <body>
    <!-- 기존 세팅 코드 -->
    <!-- <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script> -->

    <div class="todo-container">
      <h1 class="todo-container__header">BOMI TODO</h1>
      <form id="todo-form" class="todo-container__form">
        <input
          type="text"
          id="todo-input"
          class="todo-container__input"
          placeholder="할 일을 입력해주세요."
          required 
        /> <!-- required: 무조건 값이 들어가야 함 -->
        <button type="submit" class="todo-container__button">할 일 추가</button> <!-- 버튼이 눌렸을 때 액션을 취하기 위해서는 반드시 type="submit"이 필요함 -->
      </form>
      <div class="render-container">
        <div class="render-container__section">
          <h2 class="render-container__title">할 일</h2>
          <ul id="todo-list" class="render-container__list">
            <li class="render-container__item"></li>
          </ul>
        </div>
        <div class="render-container__section">
          <h2 class="render-container__title">완료</h2>
          <ul id="done-list" class="render-container__list"></ul>
        </div>
      </div>
    </div>
  </body>
</html>
