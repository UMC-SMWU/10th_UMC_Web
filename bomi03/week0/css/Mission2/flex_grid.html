<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flex_grid</title>
  <link rel="stylesheet" href="flex_grid.css" />
</head>

<body>
  <div class="layout">
    <div class="layout__top">
      <header class="layout__header">HEADER</header>
      <nav class="layout__menu">MENU</nav>
    </div>

    <section class="layout__hero">HERO</section>

    <main class="layout__middle">
      <section class="layout__main">MAIN</section>
      <div class="layout__blank"></div>

      <div class="layout__side">
        <section class="layout__image">IMAGE</section>
        <section class="layout__extra">EXTRA</section>
      </div>
    </main>

    <footer class="layout__banner">BANNER</footer>
  </div>
</body>
</html>
