<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>translate example</title>
  <style>
    .translate-example {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: lightgoldenrodyellow;
    }
  </style>
</head>
<body>
  <div class="translate-example">text test</div>
</body>
</html>
