<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation example bouncingball</title>
  <style>
    .container{
      padding: 100px;
    }
    .ball{
        width: 50px;
        height: 50px;
        background-color: purple;
        border-radius: 50%;
        animation: bounce 1s infinite alternate ease-in-out;
    }
    @keyframes bounce{
        0% {
            transform: translateY(0);
        }
        100% {
            transform: translateY(-100px);
        }
    }
  </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
</body>
</html>
