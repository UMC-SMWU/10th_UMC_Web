<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todolist</title>

    <link rel="stylesheet" href="./src/style.css">
    <script type="module" src="./dist/script.js"></script>
</head>
<body>
    <div class="todo-container">
        <h1 class="todo-container_header">Todo List</h1>
        <form id="todo-form" class="todo-container_form">
            <input 
            type="text"
            id="todo-input"
            class="todo-container_input"
            placeholder="할 일 입력하기"
            required/>
            <button type="submit" class="todo-container_btn">제출</button>
        </form>
        <div class="render-container">
            <div class="render-container_section">
                <h2 class="render-container_title">해야 할 일</h2>
                <ul id="todo-list" class="render-container_list"></ul>
            </div>
            <div class="render-container_section">
                <h2 class="render-container_title">완료한 일</h2>
                <ul id="done-list" class="render-container_list"></ul>
            </div>
        </div>
    </div>
</body>
</html>
